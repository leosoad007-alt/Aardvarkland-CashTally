name: Compilar APK CashTally Final Seguro

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Flutter Estable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar Dependencias
        run: |
          flutter pub get
          flutter clean
          flutter pub get

      - name: Compilar APK (Modo Desbloqueado Sin Firma)
        # Forzamos la compilación en modo debug para evitar la validación de key.properties
        run: flutter build apk --debug

      - name: Subir Instalador Resultante
        uses: actions/upload-artifact@v4
        with:
          name: CashTally-APK-Listo
          path: build/app/outputs/flutter-apk/*.apk
          
