name: Compilar APK CashTally Corregido

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Otorgar permisos al ejecutable de Gradle
        working-directory: ./cashtally
        run: chmod +x gradlew
        continue-on-error: true

      - name: Compilar la aplicación (Generar APK en Subcarpeta)
        working-directory: ./cashtally
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            gradle assembleRelease --no-daemon
          fi

      - name: Subir instalador como resultado
        uses: actions/upload-artifact@v4
        with:
          name: CashTally-APK-Instalador
          path: |
            cashtally/app/build/outputs/apk/release/*.apk
            cashtally/build/outputs/apk/release/*.apk
            k
            
